name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags='-s -w' -o tailmint-${{ matrix.goos }}-${{ matrix.goarch }} .
      - run: sha256sum tailmint-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: softprops/action-gh-release@v2
        with:
          files: tailmint-${{ matrix.goos }}-${{ matrix.goarch }}
